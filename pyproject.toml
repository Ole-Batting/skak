[project]
name = "skak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ole-Batting", email = "batting.ole@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.2.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pydantic>=2.11.4",
    "pygame>=2.6.1",
    "python-chess>=1.999",
    "requests>=2.32.3",
    "stockfish>=3.28.0",
    "tqdm>=4.67.1",
]

[project.scripts]
demo-play = "skak.demo_play:main"
gen-rep = "skak.generate_repetoire:main"
drill-rep = "skak.practice_repetoire:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skak"]
